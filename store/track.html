<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Test Store - parcel tracking</title>
<script src="shop.js"></script>
</head>
<body style="font:16px/1.5 system-ui,sans-serif;margin:0">
<div role="alert" style="background:#b00020;color:#fff;padding:8px 12px">TEST SITE &mdash; made-up store and orders, nothing is sold.</div>
<nav id="header" style="padding:8px 12px;border-bottom:1px solid #ddd"></nav>
<main id="main" style="padding:24px"></main>
<script>
header();
// TEST ONLY (ALT-6424): made-up parcel tracking for a delivered order.
const n = new URLSearchParams(location.search).get("n");
const o = ORDERS.find(x => x.n === n && x.status === "Delivered");
document.getElementById("main").innerHTML = o
  ? "<h1>Parcel for order " + o.n + "</h1><p>Tracking number: TEST-" + o.n.slice(2)
    + "</p><p>Delivered on the day after " + o.date + ".</p>"
  : "<h1>No parcel for this order</h1>";
</script>
</body>
</html>
