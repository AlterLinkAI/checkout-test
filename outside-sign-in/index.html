<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Maple Savings test - sign in</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0}main{padding:24px;max-width:480px}
label,input,button{display:block;margin:10px 0}.error{color:#b00020}</style>
</head>
<body>
<main id="main">
<h1>Maple Savings test</h1>
<p>TEST ONLY: a made-up bank. Sign in to see your balance.</p>
<form id="signin" action="#">
<label>Email or phone <input name="login" type="text" autocomplete="username"></label>
<label>Password <input name="password" type="password" autocomplete="current-password"></label>
<button type="submit">Sign in</button>
</form>
</main>
<script>
// TEST ONLY (ALT-7717): a sign-in page a live check treats as an outside
// service's. Nothing is sent anywhere: the form stays in this browser and
// shows "signed in (test)" with a made-up balance.
document.getElementById("signin").addEventListener("submit", (e) => {
  e.preventDefault();
  const login = (e.target.login.value || "").replace(/[<>&]/g, "");
  if (!login || !e.target.password.value) {
    document.getElementById("main").insertAdjacentHTML("beforeend",
      '<p class="error" id="err">Enter your email or phone and password.</p>');
    return;
  }
  document.getElementById("main").innerHTML = '<h1>Maple Savings test</h1>' +
    '<p id="ok">signed in (test) as ' + login + '</p><p>Balance: 1,234.56 (made up)</p>';
});
</script>
</body>
</html>
