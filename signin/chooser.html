<script>
// A provider's account chooser holding several of the owner's accounts at

banner();
document.getElementById("main").innerHTML = "<h1>Kestrel ID (test)</h1><h2>Choose an account</h2><p>to continue to Harbor Cabs test</p>" +
  CHOOSER.map((r) => '<a class="row" role="link" href="cabs.html?account=' + encodeURIComponent(r.login) + '"><b>' +
