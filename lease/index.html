<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>Your lease offer - Bright Lease (TEST SITE)</title></head><body>
<p><strong>TEST SITE</strong> - AlterLink ALT-5057. Made-up company and documents.</p>
<h1>Bright Lease</h1><h2>Your lease offer</h2>
<p>Please keep these documents for your records.</p>
<ul id="docs">
<li>Lease offer <button type="button" onclick="window.open('https://alterlinkai.github.io/checkout-test/lease/offer.pdf', '_blank')">Download document (opens in a new window)</button></li>
<li>Payment schedule <button type="button" onclick="window.open('https://alterlinkai.github.io/checkout-test/lease/schedule.pdf', '_blank')">Download document (opens in a new window)</button></li>
</ul>
<h2>Archive</h2>
<ul id="archive"></ul>
<script>
// ALT-7758: no public delay server. The slow general terms and the archive
// server that never answers are our sign-in fake's /doc/slow and /doc/never,
// given in the page's own #fragment (never sent to a server, never in this
// repo): #slow=<url>&never=<url>, as lease/tf.html. Without #slow the terms
// open at once from this site; without #never the archive row is not shown.
const p = new URLSearchParams(location.hash.slice(1));
const ok = (u) => u && /^https:\/\//.test(u);
const row = (list, title, url) => {
  const li = document.createElement("li");
  li.append(title + " ");
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = "Download document (opens in a new window)";
  b.onclick = () => window.open(url, "_blank");
  li.append(b);
  document.getElementById(list).append(li);
};
row("docs", "General terms and conditions",
    ok(p.get("slow")) ? p.get("slow") : "https://alterlinkai.github.io/checkout-test/lease/terms.pdf");
if (ok(p.get("never"))) row("archive", "Old contract (archive server)", p.get("never"));
</script>
</body></html>
